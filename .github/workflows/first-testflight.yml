name: First TestFlight Build

# One-shot workflow for the specifically approved MEAT 0.1.0 (1) build.
# Do not merge this workflow to main or reuse it for another build without new explicit approval.
on:
  push:
    branches:
      - cteschendorf/run-first-testflight

permissions:
  contents: read

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi
      - name: Initialize EAS project
        run: npx eas-cli@latest init --force --non-interactive
      - name: Build and submit to TestFlight
        run: >-
          npx eas-cli@latest build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive
          --wait
          --what-to-test "First MEAT dogfood build: manual/local food logging, Today nutrition totals, and independent food-source settings."
