  <path d="M144 70C108 84 85 113 82 151C79 190 95 234 120 278" fill="none" stroke="#FFE8D0" stroke-width="9" stroke-linecap="round" opacity="0.92"/>
  <path d="M124 284C151 330 188 375 228 415C243 430 257 444 270 437" fill="none" stroke="#FFD4AC" stroke-width="8" stroke-linecap="round" opacity="0.78"/>
