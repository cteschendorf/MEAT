      <stop offset="0.48" stop-color="#F2A378"/>
      <stop offset="1" stop-color="#C9583E"/>
    </linearGradient>
    <linearGradient id="meat" x1="118" y1="80" x2="352" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F12A2F"/>
      <stop offset="0.55" stop-color="#D91F26"/>
      <stop offset="1" stop-color="#A9131A"/>
    </linearGradient>
    <linearGradient id="bone" x1="196" y1="92" x2="274" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8E9"/>
      <stop offset="0.62" stop-color="#FFE4BE"/>
      <stop offset="1" stop-color="#F2C18F"/>
    </linearGradient>
  </defs>

