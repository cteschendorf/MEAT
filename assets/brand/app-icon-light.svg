    <path d="M120 141C147 151 165 166 174 190C181 211 177 235 186 254"/>
    <path d="M103 190C128 189 148 200 160 218"/>
    <path d="M133 272C152 260 174 262 192 278C205 290 211 307 222 316"/>
    <path d="M163 103C184 118 198 138 203 161"/>
    <path d="M316 131C338 119 367 121 389 138"/>
    <path d="M304 179C331 174 357 184 374 205"/>
    <path d="M288 250C316 247 338 259 350 279"/>
    <path d="M279 313C303 318 319 332 326 353"/>
    <path d="M205 347C223 338 245 340 260 352"/>
