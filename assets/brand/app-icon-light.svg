    d="M168 101C189 91 215 93 240 105C263 116 284 119 310 107C335 95 355 97 363 110C371 123 362 139 347 147C322 160 297 159 277 151L279 374C280 400 272 421 257 424C242 427 232 410 236 388L247 155C225 158 203 152 182 142C163 133 153 119 158 109C160 105 163 103 168 101Z"
