name = "meat-usda-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-29"
workers_dev = false
preview_urls = false

# Food search terms are sensitive. Disable Workers Logs so fetch invocation
# URLs (including `?q=`) are never retained by platform observability.
[observability]
enabled = false

[observability.logs]
invocation_logs = false

[[routes]]
pattern = "api.meatnutrition.app"
custom_domain = true

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
